<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Todo List</title>
</head>
<body>
  <div id="sidebar">
    <h2>Projects</h2>
    <ul id="project-list"></ul>
    <button id="add-project-btn">+ New Project</button>
  </div>

  <div id="main">
    <h2 id="current-project-title"></h2>
    <ul id="todo-list"></ul>
    <button id="add-todo-btn">+ New Todo</button>
  </div>

  <dialog id="todo-dialog">
    <form id="todo-form">
      <label>
        Title
        <input type="text" id="todo-title-input" required>
      </label>
      <label>
        Description
        <input type="text" id="todo-description-input">
      </label>
      <label>
        Due date
        <input type="date" id="todo-duedate-input" required>
      </label>
      <label>
        Priority
        <select id="todo-priority-input">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <button type="submit">Save</button>
      <button type="button" id="todo-cancel-btn">Cancel</button>
    </form>
  </dialog>
</body>
</html>
